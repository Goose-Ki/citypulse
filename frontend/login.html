<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityPulse — Вход</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div id="view-login">
      <h1>Добро пожаловать</h1>
      <p class="subtitle">Введите email, чтобы войти</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
        <div class="form-error" id="login-error"></div>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" id="btn-login" style="width:100%">Войти</button>
      <div class="auth-toggle">Нет аккаунта? <a href="#" id="to-register">Зарегистрироваться</a></div>
      <div style="margin-top:12px;text-align:center"><a href="index.html" class="btn btn-ghost">← На афишу</a></div>
    </div>

    <div id="view-register" style="display:none">
      <h1>Регистрация</h1>
      <p class="subtitle">Создайте аккаунт</p>
      <div class="form-group"><label>Имя *</label><input type="text" id="reg-name" placeholder="Иван Иванов" /></div>
      <div class="form-group"><label>Email *</label><input type="email" id="reg-email" placeholder="you@example.com" /></div>
      <div class="form-group"><label>Пароль *</label><input type="password" id="reg-password" placeholder="Минимум 4 символа" /></div>
      <div class="form-group"><label>Возраст</label><input type="number" id="reg-age" placeholder="25" min="1" max="120" /></div>
      <div class="form-error" id="reg-error"></div>
      <button class="btn btn-primary" id="btn-register" style="width:100%;margin-top:8px">Создать аккаунт</button>
      <div class="auth-toggle">Уже есть аккаунт? <a href="#" id="to-login">Войти</a></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  if (getSession()) location.href = 'index.html';

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast show ${type}`;
    setTimeout(() => t.className = 'toast', 3000);
  }

  document.getElementById('to-register').addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-register').style.display = 'block';
  });
  document.getElementById('to-login').addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('view-login').style.display = 'block';
    document.getElementById('view-register').style.display = 'none';
  });

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl    = document.getElementById('login-error');
    errEl.textContent = '';
    if (!email)    { errEl.textContent = 'Введите email'; return; }
    if (!password) { errEl.textContent = 'Введите пароль'; return; }
    try {
      const user = await apiFetch('/users/login', {
        method: 'POST',
        body: JSON.stringify({ email, password }),
      });
      setSession({ id: user.id, name: user.name, email: user.email, role: user.role });
      showToast(`Добро пожаловать, ${user.name}!`);
      setTimeout(() => location.href = 'index.html', 800);
    } catch (err) { errEl.textContent = err.message; }
  });

  document.getElementById('login-email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });

  document.getElementById('btn-register').addEventListener('click', async () => {
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const age   = document.getElementById('reg-age').value;
    const errEl = document.getElementById('reg-error');
    const password = document.getElementById('reg-password').value;
    errEl.textContent = '';
    if (!name)  { errEl.textContent = 'Введите имя'; return; }
    if (!email) { errEl.textContent = 'Введите email'; return; }
    if (!password) { errEl.textContent = 'Введите пароль'; return; }
    try {
      const payload = { name, email, password };
      if (age) payload.age = Number(age);
      const user = await usersApi.create(payload);
      setSession({ id: user.id, name: user.name, email: user.email, role: user.role });
      showToast('Аккаунт создан!');
      setTimeout(() => location.href = 'index.html', 800);
    } catch (err) { errEl.textContent = err.message; }
  });
</script>
</body>
</html>
