<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityPulse — Городская афиша</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">City<span>Pulse</span></a>
  <ul class="navbar-links">
    <li><a href="index.html" class="active">Афиша</a></li>
    <li><a href="admin.html" id="nav-admin" style="display:none">Админ</a></li>
  </ul>
  <div id="nav-auth" style="display:flex; gap:8px;">
    <a href="login.html" class="btn btn-outline">Войти</a>
  </div>
  <div id="nav-user" style="display:none" class="nav-user">
    <span class="nav-username"></span>
    <span class="nav-role badge"></span>
    <button class="btn btn-ghost" id="btn-logout">Выйти</button>
  </div>
</nav>

<section class="hero">
  <div class="hero-label">Городская афиша</div>
  <h1>Всё, что происходит<br>в твоём <em>городе</em></h1>
  <p>Концерты, выставки, спорт и фестивали — найди событие, которое тебя ждёт.</p>
</section>

<div class="filters">
  <input type="text" class="filter-input" id="filter-city" placeholder="🏙 Город..." />
  <select class="filter-input" id="filter-category">
    <option value="">Все категории</option>
    <option value="concert">🎵 Концерт</option>
    <option value="exhibition">🖼 Выставка</option>
    <option value="sport">⚽ Спорт</option>
    <option value="theatre">🎭 Театр</option>
    <option value="festival">🎪 Фестиваль</option>
    <option value="other">Другое</option>
  </select>
  <button class="btn btn-primary" id="btn-search">Найти</button>
  <button class="btn btn-outline" id="btn-reset">Сбросить</button>
</div>

<main class="events-grid" id="events-grid">
  <div class="state-message"><h3>Загрузка событий...</h3></div>
</main>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  updateNavbar();

  document.getElementById('btn-logout')?.addEventListener('click', () => {
    clearSession(); location.reload();
  });

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => t.className = 'toast', 3000);
  }

  function categoryLabel(cat) {
    const map = { concert:'🎵 Концерт', exhibition:'🖼 Выставка', sport:'⚽ Спорт', theatre:'🎭 Театр', festival:'🎪 Фестиваль', other:'Другое' };
    return map[cat] || cat;
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString('ru-RU', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function renderEvents(events) {
    const grid = document.getElementById('events-grid');
    const session = getSession();
    if (!events.length) {
      grid.innerHTML = `<div class="state-message"><h3>Событий не найдено</h3><p>Попробуйте изменить фильтры</p></div>`;
      return;
    }
    grid.innerHTML = events.map(ev => `
      <article class="event-card">
        <div class="event-card-header">
          <span class="event-category cat-${ev.category}">${categoryLabel(ev.category)}</span>
          <span class="event-price ${!ev.price ? 'free' : ''}">${ev.price ? ev.price + ' ₽' : 'Бесплатно'}</span>
        </div>
        <div class="event-card-body">
          <div class="event-title">${ev.title}</div>
          <div class="event-meta">
            <span>📅 ${formatDate(ev.date)}</span>
            <span>📍 ${ev.city}${ev.location ? ', ' + ev.location : ''}</span>
          </div>
        </div>
        <div class="event-card-footer">
          <span class="participants">👥 ${ev.registrationCount || 0}${ev.maxParticipants ? '/' + ev.maxParticipants : ''}</span>
          ${session
            ? `<button class="btn btn-primary btn-register" style="padding:6px 14px;font-size:13px;" data-id="${ev.id}">Записаться</button>`
            : `<a href="login.html" class="btn btn-outline" style="padding:6px 14px;font-size:13px;">Войти</a>`}
        </div>
      </article>
    `).join('');

    grid.querySelectorAll('.btn-register').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await eventsApi.register(btn.dataset.id);
          showToast('Вы записались на событие!');
          loadEvents();
        } catch (err) { showToast(err.message, 'error'); }
      });
    });
  }

  async function loadEvents() {
    const city     = document.getElementById('filter-city').value.trim();
    const category = document.getElementById('filter-category').value;
    try {
      const events = await eventsApi.getAll({ city, category });
      renderEvents(events);
    } catch (err) {
      document.getElementById('events-grid').innerHTML =
        `<div class="state-message"><h3>Ошибка загрузки</h3><p>${err.message}</p></div>`;
    }
  }

  document.getElementById('btn-search').addEventListener('click', loadEvents);
  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('filter-city').value = '';
    document.getElementById('filter-category').value = '';
    loadEvents();
  });
  document.getElementById('filter-city').addEventListener('keydown', e => { if (e.key === 'Enter') loadEvents(); });

  loadEvents();
</script>
</body>
</html>
